name: Build Android APK

on:
  push:
  workflow_dispatch:

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-apk:
    name: Build installable debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EXAMBASE_API_BASE_URL: ${{ vars.EXAMBASE_API_BASE_URL }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Locate Android project
        id: locate
        shell: bash
        run: |
          # Works even if the project was uploaded inside a sub-folder.
          SETTINGS=$(find . -type f -name settings.gradle.kts -not -path '*/backend/*' -not -path '*/node_modules/*' | while read f; do grep -q ':app' "$f" && echo "$f" && break; done)
          if [[ -z "$SETTINGS" ]]; then
            echo "::error::android/settings.gradle.kts not found. Upload the UNZIPPED project contents (android/ folder must be in the repo)."
            find . -maxdepth 3 -not -path './.git/*' | head -50
            exit 1
          fi
          DIR=$(dirname "$SETTINGS")
          echo "Android project: $DIR"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: API endpoint info
        shell: bash
        run: |
          if [[ -z "$EXAMBASE_API_BASE_URL" ]]; then
            echo "::warning::EXAMBASE_API_BASE_URL is empty. APK builds fine, but login/online features need a public HTTPS backend URL."
          elif [[ "$EXAMBASE_API_BASE_URL" != https://* ]]; then
            echo "::warning::EXAMBASE_API_BASE_URL should start with https://"
          fi

      - name: Build APK
        working-directory: ${{ steps.locate.outputs.dir }}
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --console=plain --stacktrace :app:assembleDebug \
            -PEXAMBASE_API_BASE_URL="$EXAMBASE_API_BASE_URL" 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      - name: Upload build log and reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-log
          path: |
            build.log
            **/build/reports
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ExamBaseAI-debug-apk
          path: ${{ steps.locate.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
